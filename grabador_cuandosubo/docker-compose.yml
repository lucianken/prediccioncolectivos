name: grabador-cuandosubo

services:
  grabador-cuandosubo:
    build: .
    container_name: grabador-cuandosubo
    restart: always
    env_file: .env                     # OBA_KEY=...  (nunca en git; ver .env.example)
    environment:
      - DATA_DIR=/data
      - RECORD_LINES=39 26 42 92 152 168
      - OBA_MIN_INTERVAL_MS=3000
      - CYCLE_S=45
      - ARRIVALS_PER_CYCLE=3
      - TRIPS_PER_CYCLE=2
      - SWEEP=0                        # sin rotación C (resto de AMBA): solo las líneas de RECORD_LINES
      # - ARRIVAL_STOPS=14_20444 ...   # opcional: subconjunto de arrival_stops.json
    volumes:
      # Carpeta PROPIA. Nunca /mnt/buffer/grabaciones (la del grabador CABA).
      - /mnt/buffer/grabaciones_cuandosubo:/data
    dns: [1.1.1.1, 8.8.8.8]            # el DNS de la VM falló con Docker (SRV / "server misbehaving")
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/data/health')<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
